# Example s5fs device spec.
#
# Copy to ~/.config/s5fs/devices (or point $S5FS_DEVICES at it) to add disks
# or override the built-ins.  List the effective table with `s5fs devices`.
#
#   - section header [name]  is the -d name you pass to mkfs/mktree
#   - blocks                 REQUIRED, capacity in 512-byte blocks (sectors)
#   - desc                   optional, shown by `s5fs devices`
#   - since / until          optional advisory range (v7|2.8|2.9|2.10);
#                            default v7..2.10, i.e. never warns
#   - partitions             optional; "letter:start:length ..." in 512-byte
#                            blocks -- the driver's *_sizes[] table.  Enables
#                            `-P letter` (and `s5fs devices <name>`) for this
#                            disk.  Match your KERNEL's table; the disk has no
#                            on-disk label, so it must conform to the kernel.
#
# Unknown keys are ignored, so future geometry fields are harmless.

# A big Fujitsu Eagle behind an Emulex SC-21 UNIBUS SMD controller, with a
# site partition layout (a=root, b=swap, c=/usr, h=whole disk).  With this,
# `s5fs mkfs -d eagle -P a whole.dsk`, `s5fs fsck -d eagle -P c whole.dsk`,
# etc. operate inside the chosen partition of a whole-disk image.
[eagle]
blocks     = 1002000
desc       = Fujitsu M2351 Eagle (SMD, ~490 MB)
partitions = a:0:20000 b:20000:20000 c:40000:962000 h:0:1002000

# Override a built-in: an RL02 whose last cylinder is reserved for the
# DEC-standard bad-sector table, so a few blocks fewer are usable.
[rl02]
blocks = 20000
desc   = RL02, last cyl reserved for bad144
since  = v7
until  = 2.10
